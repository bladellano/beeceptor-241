services:
  app:
    build: .
    ports:
      - "8080:80"
    depends_on:
      - db
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY}
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: mock
      DB_USERNAME: mock
      DB_PASSWORD: secret

  db:
    image: mariadb:11
    environment:
      MYSQL_DATABASE: mock
      MYSQL_USER: mock
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
